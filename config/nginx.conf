worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # Security headers
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy strict-origin-when-cross-origin;

    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=webhook:10m rate=30r/m;
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/m;

    # Gzip
    gzip on;
    gzip_types application/json;

    # WebSocket upgrade only when the client asks for it (keeps upstream keepalive working)
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      '';
    }

    # ── n8n (dashboard + webhooks) ───────────────────────────
    upstream n8n_upstream {
        server n8n:5678;
        keepalive 16;
    }

    server {
        listen 80;
        server_name n8n.yourdomain.com;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name n8n.yourdomain.com;

        ssl_certificate     /etc/ssl/certs/fullchain.pem;
        ssl_certificate_key /etc/ssl/certs/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        # Webhook endpoint — higher rate limit
        location /webhook/ {
            limit_req zone=webhook burst=50 nodelay;
            proxy_pass         http://n8n_upstream;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection $connection_upgrade;
            proxy_read_timeout 300;
        }

        # n8n UI — restrict to your IP (replace YOUR.IP.ADDRESS.HERE below,
        # nginx refuses to start while the placeholder is still there)
        location / {
            allow YOUR.IP.ADDRESS.HERE;
            deny  all;
            limit_req zone=api burst=30 nodelay;
            proxy_pass         http://n8n_upstream;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection $connection_upgrade;
            proxy_read_timeout 300;
        }
    }

    # ── Evolution API ────────────────────────────────────────
    upstream evo_upstream {
        server evolution:8080;
        keepalive 16;
    }

    server {
        listen 80;
        server_name evo.yourdomain.com;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name evo.yourdomain.com;

        ssl_certificate     /etc/ssl/certs/fullchain.pem;
        ssl_certificate_key /etc/ssl/certs/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        # Restrict Evolution API to your IP (n8n talks to it directly over the
        # Docker network, not through this proxy)
        location / {
            allow YOUR.IP.ADDRESS.HERE;
            deny  all;
            proxy_pass         http://evo_upstream;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection $connection_upgrade;
            proxy_read_timeout 120;
        }
    }
}
