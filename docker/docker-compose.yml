# WhatsApp AI Assistant — Docker Compose
# Run from the project ROOT with:
#   docker compose -f docker/docker-compose.yml --env-file .env up -d
# Or from the docker/ folder with:
#   docker compose --env-file ..\.env up -d

networks:
  ai_net:
    driver: bridge

volumes:
  postgres_data:
  n8n_data:
  evolution_data:
  redis_data:

services:

  # ─── PostgreSQL ─────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: wa_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-waassistant}
      POSTGRES_USER: ${POSTGRES_USER:-wauser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Path is relative to this docker-compose.yml file (in docker/ subfolder)
      - ../database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - ai_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-wauser} -d ${POSTGRES_DB:-waassistant}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Redis ──────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: wa_redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - ai_net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── n8n ────────────────────────────────────────────────────
  # NOTE: n8n v1+ removed N8N_BASIC_AUTH_ACTIVE/USER/PASSWORD.
  # Authentication is now email/password via the owner account.
  # N8N_INSTANCE_OWNER_MANAGED_BY_ENV pre-provisions the owner so
  # you don't need to click through the setup wizard on first boot.
  n8n:
    image: n8nio/n8n:latest
    container_name: wa_n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      # ── Database ──────────────────────────────────────────────
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB:-waassistant}
      DB_POSTGRESDB_USER: ${POSTGRES_USER:-wauser}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      # ── Instance owner (replaces removed basic-auth env vars) ─
      N8N_INSTANCE_OWNER_MANAGED_BY_ENV: "true"
      N8N_INSTANCE_OWNER_EMAIL: ${N8N_OWNER_EMAIL:-admin@localhost.local}
      N8N_INSTANCE_OWNER_FIRST_NAME: ${N8N_OWNER_FIRST_NAME:-Admin}
      N8N_INSTANCE_OWNER_LAST_NAME: ${N8N_OWNER_LAST_NAME:-User}
      # IMPORTANT: must be a bcrypt hash — generated in setup.sh or manually:
      #   htpasswd -bnBC 12 "" "YourPassword" | tr -d ':\n'
      N8N_INSTANCE_OWNER_PASSWORD_HASH: ${N8N_OWNER_PASSWORD_HASH}
      # ── Network / URL ─────────────────────────────────────────
      N8N_HOST: ${N8N_HOST:-localhost}
      N8N_PORT: 5678
      N8N_PROTOCOL: ${N8N_PROTOCOL:-http}
      WEBHOOK_URL: ${WEBHOOK_URL:-http://localhost:5678}
      # ── Security ──────────────────────────────────────────────
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_METRICS: "false"
      # ── Execution cleanup ─────────────────────────────────────
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: 336   # hours (14 days)
      # ── Logging ───────────────────────────────────────────────
      N8N_LOG_LEVEL: info
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-UTC}
      # ── Allow env variables to be read inside expressions ─────
      # Without this, $env.GEMINI_API_KEY etc. won't resolve in nodes
      N8N_CUSTOM_ENV_ENABLED: "true"
      # Expose the vars the workflows need
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.0-flash}
      GEMINI_MAX_TOKENS: ${GEMINI_MAX_TOKENS:-1000}
      GEMINI_TEMPERATURE: ${GEMINI_TEMPERATURE:-0.85}
      EVOLUTION_BASE_URL: ${EVOLUTION_BASE_URL:-http://evolution:8080}
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY}
      ESCALATION_PHONE: ${ESCALATION_PHONE}
      YOUR_NAME: ${YOUR_NAME:-Admin}
      YOUR_PHONE: ${YOUR_PHONE}
      YOUR_TIMEZONE: ${YOUR_TIMEZONE:-UTC}
      FAMILY_NUMBERS: ${FAMILY_NUMBERS:-}
      FRIEND_NUMBERS: ${FRIEND_NUMBERS:-}
      RATE_LIMIT_PER_HOUR: ${RATE_LIMIT_PER_HOUR:-20}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET}
    volumes:
      - n8n_data:/home/node/.n8n
      - ../n8n-workflows:/workflows:ro
    networks:
      - ai_net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ─── Evolution API v2 (WhatsApp Gateway) ────────────────────
  # Image: evoapicloud/evolution-api (migrated from atendai in 2025)
  # Tag v2.3.7 is the latest stable public release as of June 2026.
  # Do NOT use :latest — it was private for months and may change.
  evolution:
    image: evoapicloud/evolution-api:v2.3.7
    container_name: wa_evolution
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # ── Server ────────────────────────────────────────────────
      SERVER_URL: ${EVOLUTION_BASE_URL:-http://localhost:8080}
      SERVER_TYPE: http
      SERVER_PORT: 8080
      CORS_ORIGIN: "*"
      CORS_METHODS: "POST,GET,PUT,DELETE"
      CORS_CREDENTIALS: "true"
      # ── Logging ───────────────────────────────────────────────
      LOG_LEVEL: "ERROR,WARN,DEBUG,INFO,LOG,VERBOSE,DARK,WEBHOOKS"
      LOG_COLOR: "true"
      LOG_BAILEYS: "error"
      # ── Instance management ───────────────────────────────────
      DEL_INSTANCE: "false"
      # ── Database (Evolution API v2 uses DATABASE_PROVIDER + URI)
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: "postgresql://${POSTGRES_USER:-wauser}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-waassistant}?schema=public"
      DATABASE_CONNECTION_CLIENT_NAME: evolution
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "true"
      DATABASE_SAVE_MESSAGE_UPDATE: "true"
      DATABASE_SAVE_DATA_CONTACTS: "true"
      DATABASE_SAVE_DATA_CHATS: "true"
      DATABASE_SAVE_DATA_LABELS: "true"
      DATABASE_SAVE_DATA_HISTORIC: "true"
      # ── Redis cache ───────────────────────────────────────────
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: "redis://:${REDIS_PASSWORD}@redis:6379/1"
      CACHE_REDIS_PREFIX_KEY: "evolution"
      CACHE_REDIS_SAVE_INSTANCES: "false"
      CACHE_LOCAL_ENABLED: "false"
      # ── Global webhook → n8n ──────────────────────────────────
      # Uses internal Docker network name (n8n container), NOT localhost
      WEBHOOK_GLOBAL_URL: "http://n8n:5678/webhook/whatsapp"
      WEBHOOK_GLOBAL_ENABLED: "true"
      WEBHOOK_GLOBAL_WEBHOOK_BY_EVENTS: "false"
      # ── Authentication (v2 uses AUTHENTICATION_API_KEY) ───────
      AUTHENTICATION_TYPE: apikey
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY}
      AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES: "true"
    volumes:
      - evolution_data:/evolution/instances
    networks:
      - ai_net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ─── Nginx reverse proxy (production only) ──────────────────
  # Only started with: docker compose --profile production up -d
  # For local dev, access n8n at http://localhost:5678 directly.
  nginx:
    image: nginx:alpine
    container_name: wa_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../config/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../config/ssl:/etc/ssl/certs:ro
    networks:
      - ai_net
    depends_on:
      - n8n
      - evolution
    profiles:
      - production
